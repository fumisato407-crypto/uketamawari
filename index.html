<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>予約承り表</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

<!-- ヘッダー（全画面共通） -->
<header id="app-header">
  <h1>予約承り表</h1>
  <nav>
    <button data-goto="screen-order" class="nav-btn active">受注入力</button>
    <button data-goto="screen-list" class="nav-btn">予約一覧</button>
    <button data-goto="screen-master" class="nav-btn">設定</button>
  </nav>
</header>

<!-- 2.1 受注入力画面 -->
<main id="screen-order" class="screen active">
  <section id="detail-pane">
    <h2>明細</h2>
    <ul id="detail-list"></ul>
    <div id="detail-summary">
      <div class="sum-row"><span>トータル数</span><span id="total-qty">0</span></div>
      <div class="sum-row total"><span>合計（税込）</span><span id="total-price">¥0</span></div>
    </div>
    <div id="order-bottom-bar">
      <button id="btn-clear-order" class="btn-sub">クリア</button>
      <button id="btn-to-customer" class="btn-main" data-goto="screen-customer">お客様情報へ ▶</button>
    </div>
  </section>
  <section id="product-pane">
    <div id="category-tabs"></div>
    <div id="product-grid"></div>
  </section>
</main>

<!-- 2.2 顧客・受渡情報画面 -->
<main id="screen-customer" class="screen">
  <h2>ご予約情報のご入力（お客様にお渡しください）</h2>
  <div id="customer-form">
    <div class="form-row">
      <label for="f-date">日付</label>
      <input type="date" id="f-date">
    </div>
    <div class="form-row">
      <label>受付</label>
      <div class="form-field">
        <div id="staff-btns" class="btn-group"></div>
        <input type="text" id="f-staff" placeholder="担当者名">
      </div>
    </div>
    <div class="form-row">
      <label for="f-name">御名前 <span class="req">必須</span></label>
      <div class="form-field with-suffix">
        <input type="text" id="f-name"><span class="suffix">様</span>
      </div>
    </div>
    <div class="form-row">
      <label for="f-address">御住所</label>
      <input type="text" id="f-address">
    </div>
    <div class="form-row">
      <label for="f-phone">電話番号 <span class="req">必須</span></label>
      <input type="tel" id="f-phone" inputmode="numeric" placeholder="例: 0312345678">
    </div>
    <div class="form-row">
      <label>商品内容メモ</label>
      <div class="form-field" id="item-notes"></div>
    </div>
    <div class="form-row">
      <label>受渡方法</label>
      <div class="btn-group" id="delivery-toggle">
        <button data-val="来店" class="toggle-btn active">御来店</button>
        <button data-val="配送" class="toggle-btn">配送</button>
      </div>
    </div>
    <div class="form-row" id="row-visit">
      <label>御来店日時</label>
      <div class="form-field">
        <input type="date" id="f-visit-date">
        <input type="time" id="f-visit-time" step="600">
      </div>
    </div>
    <div class="form-row hidden" id="row-ship">
      <label>発送日・着日</label>
      <div class="form-field">
        <span class="mini-label">発送日</span><input type="date" id="f-ship">
        <span class="mini-label">着日</span><input type="date" id="f-arrive">
      </div>
    </div>
    <div class="form-row">
      <label>熨斗</label>
      <div class="form-field">
        <div class="btn-group" id="noshi-toggle">
          <button data-val="なし" class="toggle-btn active">なし</button>
          <button data-val="内" class="toggle-btn">内</button>
          <button data-val="外" class="toggle-btn">外</button>
        </div>
        <span class="mini-label">サイズ</span><input type="text" id="f-noshi-size" class="short">
      </div>
    </div>
    <div class="form-row" id="row-omotegaki">
      <label>表書き</label>
      <div class="form-field">
        <div class="btn-group" id="omotegaki-btns"></div>
        <input type="text" id="f-omotegaki" placeholder="自由入力">
      </div>
    </div>
    <div class="form-row">
      <label for="f-packaging">菓子・包材</label>
      <input type="text" id="f-packaging">
    </div>
    <div class="form-row">
      <label for="f-memo">備考</label>
      <textarea id="f-memo" rows="3"></textarea>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="btn-sub" data-goto="screen-order">◀ 戻る</button>
    <button id="btn-to-preview" class="btn-main">保存して印刷プレビューへ ▶</button>
  </div>
</main>

<!-- 2.3 印刷プレビュー画面 -->
<main id="screen-preview" class="screen">
  <h2>印刷プレビュー</h2>
  <div id="preview-scroll">
    <div id="print-sheet"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-sub" data-goto="screen-customer">◀ 編集に戻る</button>
    <button id="btn-save-only" class="btn-sub">保存のみ</button>
    <button id="btn-print" class="btn-main">印刷</button>
  </div>
</main>

<!-- 2.4 予約一覧画面 -->
<main id="screen-list" class="screen">
  <h2>予約一覧</h2>
  <div class="btn-group" id="list-filter">
    <button data-val="all" class="toggle-btn active">全て</button>
    <button data-val="undelivered" class="toggle-btn">未受渡</button>
    <button data-val="delivered" class="toggle-btn">受渡済</button>
  </div>
  <ul id="order-list"></ul>
</main>

<!-- 2.5 商品マスタ編集画面 -->
<main id="screen-master" class="screen">
  <h2>設定・商品マスタ編集</h2>
  <p class="placeholder">（実装順6で作成）</p>
</main>

<!-- 数量・単価入力テンキー（モーダル） -->
<div id="numpad-overlay" class="hidden">
  <div id="numpad">
    <div id="numpad-title">個数</div>
    <div id="numpad-display">0</div>
    <div id="numpad-keys">
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="C" class="key-c">C</button><button data-key="0">0</button><button data-key="00">00</button>
    </div>
    <div id="numpad-actions">
      <button id="numpad-cancel" class="btn-sub">やめる</button>
      <button id="numpad-ok" class="btn-main">決定</button>
    </div>
  </div>
</div>

<script src="data/products.sample.js"></script>
<script src="js/db.js"></script>
<script src="js/master.js"></script>
<script src="js/app.js"></script>
</body>
</html>
